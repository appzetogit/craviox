# Craviox — managed outside CloudPanel. One domain: app, admin (/admin), API (/api), sockets, uploads.

upstream craviox_api {
    server 127.0.0.1:5000;   # PM2 cluster (2 instances) behind this port
    keepalive 64;
}
upstream craviox_socket {
    server 127.0.0.1:5001;   # single socket process: websockets never split across workers
    keepalive 64;
}

map $http_upgrade $craviox_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=craviox_api_limit:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=craviox_perip:10m;

# http -> https, www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name craviox.com www.craviox.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://craviox.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.craviox.com;
    ssl_certificate     /etc/letsencrypt/live/craviox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craviox.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://craviox.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name craviox.com;
    ssl_certificate     /etc/letsencrypt/live/craviox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craviox.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/craviox/web;
    index index.html;
    client_max_body_size 6M;
    access_log /var/log/nginx/craviox.access.log;
    error_log  /var/log/nginx/craviox.error.log;

    gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location = /health { proxy_pass http://craviox_api; proxy_set_header Connection ""; access_log off; }
    location = /ready  { proxy_pass http://craviox_api; proxy_set_header Connection ""; access_log off; }

    location /api/ {
        limit_req  zone=craviox_api_limit burst=60 nodelay;
        limit_conn craviox_perip 30;
        proxy_pass http://craviox_api;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://craviox_socket;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $craviox_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /uploads/ {
        alias /var/www/craviox/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location = /sw.js                   { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location = /firebase-messaging-sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location = /index.html              { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
